<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exploding Head — 3D view</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="scene-page">
  <main class="scene-shell">
    <header class="scene-header">
      <a class="back-link" href="../index.html">← Return to Film Review</a>
      <p class="eyebrow">Film Review</p>
      <h1>Exploding Head — 3D view</h1>
    </header>

    <p class="scene-description" id="scene-description">
      A simple companion scene for the Exploding Head review.
    </p>
    <p id="scene-status" role="status">Loading…</p>
    <canvas id="renderCanvas" tabindex="0" aria-label="3D scene for Exploding Head review" aria-describedby="scene-description scene-controls">3D scene</canvas>
    <p id="scene-controls">Drag to look around. With the scene focused, use the arrow keys to move. Press Tab to leave. Reset view restores the starting camera.</p>
    <button id="reset-view" type="button" disabled>Reset view</button>
  </main>

  <script src="vendor/babylon.js"></script>
  <script src="index.js"></script>
</body>
</html>
